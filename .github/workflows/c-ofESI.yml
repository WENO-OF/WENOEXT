name: OpenFOAM ESI

on:
  push:
    branches: [ master, hotfix-* ]
  pull_request:
    branches: [ master, development ]

jobs:
  build-OF1912:
    name: OpenFOAM v1912
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: OpenFOAMv1912
      run: make runTestsOFv1912
  
